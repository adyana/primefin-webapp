<mat-card class="card">
  <mat-card-content>
    <h3 class="chart-title">
      <fa-icon icon="chart-line"></fa-icon>
      &nbsp;&nbsp; {{ 'labels.text.Channel Traffic' | translate }}

    <div [style.display]="hideOutput ? 'none' : 'block'">
      <canvas id="channel-traffic-chart" width="800" height="380"></canvas>
    </div>
  </mat-card-content>
</mat-card>

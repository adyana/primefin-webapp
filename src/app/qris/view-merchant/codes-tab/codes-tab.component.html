<div class="container m-t-20">
  <div class="mat-elevation-z8 table-container">
    <mifosx-page-toolbar
      searchPlaceholder="labels.text.SearchByReference"
      [count]="codesCount"
      countNoun="labels.menus.QRIS"
      (searchChange)="filterCodes($event)"
    />
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="payload">
        <th mat-header-cell *matHeaderCellDef>{{ 'labels.inputs.Payload' | translate }}</th>
        <td mat-cell *matCellDef="let code">{{ code.payload }}</td>
      </ng-container>

      <ng-container matColumnDef="printVersion">
        <th mat-header-cell *matHeaderCellDef>{{ 'labels.inputs.Print Version' | translate }}</th>
        <td mat-cell *matCellDef="let code">{{ code.printVersion }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>{{ 'labels.inputs.Status' | translate }}</th>
        <td mat-cell *matCellDef="let code"><mifosx-status-pill [status]="code.status" /></td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>

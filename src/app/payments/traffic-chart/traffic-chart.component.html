<mat-card class="card">
  <mat-card-header class="header">
    <h3 class="flex-100">
      {{ 'labels.text.Payment Traffic' | translate }}
    </h3>
  </mat-card-header>

  <mat-card-content>
    <div [style.display]="hideOutput ? 'none' : 'block'">
      <canvas id="payment-traffic-chart" width="800" height="380"></canvas>
    </div>
  </mat-card-content>
</mat-card>

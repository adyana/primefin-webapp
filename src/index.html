    <!--
      OAuth Redirect Interceptor (PRODUCTION)
      -------------------------------------
      OAuth providers cannot redirect to hash-based routes (#).
      This script intercepts OAuth callbacks BEFORE Angular initializes,
      stores the response parameters, and rewrites the URL to a hash route
      that Angular can handle.

      DO NOT remove unless migrating to path-based routing.
    -->
    <script>
      (function () {
        // ===== CONFIGURATION =====
        var OAUTH_CALLBACK_PATHS = ['/callback'];
        var STORAGE_KEY = 'oauth_callback_query';

        // ===== DETECTION =====
        var params = new URLSearchParams(window.location.search);
        var isOAuthResponse = params.has('code') || params.has('error');

        if (!isOAuthResponse) {
          return;
        }

        // Prevent redirect loop
        if (window.location.hash && window.location.hash.length > 1) {
          return;
        }

        var currentPath = window.location.pathname;

        // Only allow known OAuth callback paths
        if (OAUTH_CALLBACK_PATHS.indexOf(currentPath) === -1) {
          return;
        }

        // ===== PERSIST & REDIRECT =====
        try {
          sessionStorage.setItem(STORAGE_KEY, window.location.search);
        } catch (e) {
          console.warn('OAuth interceptor: sessionStorage unavailable, appending query to hash');
        }

        // Always redirect, even if storage fails
        var redirectUrl = window.location.origin + '/#' + currentPath;

        if (!sessionStorage.getItem(STORAGE_KEY)) {
          redirectUrl += window.location.search;
        }

        window.location.replace(redirectUrl);
      })();
    </script>

    <script>
      // PrimeFin: swap brand logos for dark mode (app toggle + OS preference).
      // Update footer branding text when mifosx-footer renders.
      (function () {
        function isDark() {
          return (
            document.body.classList.contains('dark-theme') ||
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          );
        }
        function applyLogos() {
          var dark = isDark();
          document.querySelectorAll('img').forEach(function (im) {
            var s = im.getAttribute('src') || '';
            var m = s.match(/(PrimeFin_logo|primefin-lg-logo|MifosX_logo)(_dark)?\.png$/);
            if (m) {
              var base = s.slice(0, s.length - m[0].length);
              var name = m[1];
              var suffix = dark ? '_dark' : '';
              var want = base + name + suffix + '.png';
              if (s !== want) {
                im.setAttribute('src', want);
              }
            }
          });
        }
        function brandLine() {
          return 'PrimeFin ' + new Date().getFullYear() + ' · Powered by Mifos® Initiative and Apache Fineract';
        }
        function patchBrandingText(el) {
          if (el.dataset.pfBranded === '1') {
            return;
          }
          el.textContent =
            'PrimeFin ' + new Date().getFullYear() + ' · Powered by Mifos® Initiative and Apache Fineract';
          el.dataset.pfBranded = '1';
        }
        function updateFooter() {
          document.querySelectorAll('mifosx-footer').forEach(function (footer) {
            if (footer.dataset.pfBranded !== '1') {
              footer.textContent = brandLine();
              footer.dataset.pfBranded = '1';
            }
          });
          document.querySelectorAll('.branding-text').forEach(patchBrandingText);
        }
        function hideHomeExtras() {
          if ((location.hash || '').indexOf('/home') === -1) {
            return;
          }
          document.querySelectorAll('button').forEach(function (b) {
            if ((b.innerText || '').trim() === 'Global Financial Dashboard' && b.dataset.pfHidden !== '1') {
              b.style.display = 'none';
              b.dataset.pfHidden = '1';
            }
          });
        }
        function hideRetiredWidgets() {
          if ((location.hash || '').indexOf('/dashboard') === -1) {
            return;
          }
          document.querySelectorAll('mifosx-dashboard-widget').forEach(function (w) {
            if (w.dataset.pfHidden === '1') {
              return;
            }
            var title = w.innerText || '';
            if (title.indexOf('Georeference Map') !== -1) {
              var card = w.closest('mat-card');
              (card || w).style.display = 'none';
              w.dataset.pfHidden = '1';
            }
          });
        }
        function apply() {
          applyLogos();
          updateFooter();
          hideHomeExtras();
          hideRetiredWidgets();
        }
        if (window.matchMedia) {
          try {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply);
          } catch (e) {
            /* older browsers */
          }
        }
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (node.nodeType === 1 && (node.tagName === 'MIFOSX-FOOTER' || node.querySelector('mifosx-footer'))) {
                apply();
              }
            });
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        setInterval(apply, 2000);
        apply();
      })();
    </script>
